<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - FindIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container animate-fade-in" style="padding-top: 2rem; padding-bottom: 4rem;">

      <div class="contact-header">
        <h1>Get in Touch</h1>
        <p>We're here to help you with any questions or issues.</p>
      </div>

      <div class="contact-grid">

        <!-- Info Column -->
        <div>
          <div class="contact-info-card">
            <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
            <div class="contact-info-text">
              <h3>Email Support</h3>
              <p>Our team usually responds within 24 hours.</p>
              <a href="mailto:support@findit.ai">support@findit.ai</a>
            </div>
          </div>

          <div class="contact-info-card">
            <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
            <div class="contact-info-text">
              <h3>Office Location</h3>
              <p>123 AI Boulevard, Tech District<br />San Francisco, CA 94107</p>
            </div>
          </div>
        </div>

        <!-- Form Column -->
        <div class="contact-form-card">
          <form id="contact-form">
            <div class="form-group">
              <label class="form-label">Your Name</label>
              <input type="text" required class="form-control" placeholder="John Doe" />
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" required class="form-control" placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label class="form-label">Message</label>
              <textarea required rows="4" class="form-control" placeholder="How can we help you?"
                style="resize: vertical;"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary w-full mt-2" style="padding: 1rem;">
              <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="js/script.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;

      setTimeout(() => {
        showToast('Message sent! We will get back to you soon.', 'success');
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
        btn.disabled = false;
        e.target.reset();
      }, 1500);
    });
  </script>
</body>

</html>
