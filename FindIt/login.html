<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FindIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="auth-container animate-fade-in">
      <div class="auth-card">

        <div class="text-center mb-6">
          <div class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
          <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p class="text-muted" style="font-size: 0.875rem;">Sign in to your FindIt account</p>
        </div>

        <button class="btn btn-secondary w-full mb-4" onclick="handleGoogleLogin()" style="font-weight: 500;">
          <i class="fa-brands fa-google" style="color: #1e3a5f;"></i> Continue with Google
        </button>

        <div class="divider"><span>or sign in with email</span></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" class="form-control" required placeholder="you@example.com">
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <label class="form-label" style="margin-bottom: 0;">Password</label>
              <a href="#" style="font-size: 0.75rem; color: var(--secondary); font-weight: 500;">Forgot password?</a>
            </div>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" class="form-control" required placeholder="Enter your password">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-full mt-4" style="padding: 0.875rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </form>

        <p class="text-center text-muted mt-4" style="font-size: 0.875rem;">
          Don't have an account? <a href="signup.html" style="color: var(--secondary); font-weight: 600;">Create one</a>
        </p>

      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="js/script.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';
      btn.disabled = true;

      setTimeout(() => {
        const users = JSON.parse(localStorage.getItem('findit_users')) || [];
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          localStorage.setItem('findit_currentUser', JSON.stringify({ name: user.name, email: user.email }));
          showToast('Successfully logged in!', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
          showToast('Invalid email or password', 'error');
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
          btn.disabled = false;
        }
      }, 800);
    });

    window.handleGoogleLogin = () => {
      localStorage.setItem('findit_currentUser', JSON.stringify({ name: "Google User", email: "google@example.com" }));
      showToast('Google Sign In successful!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    };
  </script>
</body>

</html>
