<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - FindIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container animate-fade-in">

      <h1 style="font-size: 1.875rem; margin-bottom: 2rem;">Account Settings</h1>

      <div class="profile-layout">

        <!-- Sidebar -->
        <div class="profile-sidebar">
          <div class="user-badge">
            <div class="user-avatar-small" id="sidebar-avatar">U</div>
            <div>
              <p style="font-weight: 700;" id="sidebar-name">User Account</p>
              <p style="font-size: 0.75rem; color: var(--text-muted);">Free Plan</p>
            </div>
          </div>

          <nav class="sidebar-nav">
            <a href="#" class="active"><i class="fa-solid fa-user"></i> Personal Info</a>
            <a href="#"><i class="fa-solid fa-shield-halved"></i> Security</a>
            <a href="#"><i class="fa-solid fa-bell"></i> Notifications</a>
          </nav>
        </div>

        <!-- Content -->
        <div class="profile-content">
          <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">Personal Information</h2>

          <form id="profile-form">
            <div class="avatar-upload">
              <div class="avatar-large">
                <i class="fa-solid fa-user"></i>
                <button type="button" class="avatar-btn"><i class="fa-solid fa-camera"></i></button>
              </div>
              <div>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.25rem;">Avatar</p>
                <p style="font-size: 0.75rem; color: #94a3b8;">JPG or PNG no larger than 5MB</p>
              </div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="profile-name" class="form-control" value="User Account" required />
              </div>
              <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="profile-email" class="form-control" value="user@example.com" disabled
                  style="background: var(--bg-color); cursor: not-allowed;" />
                <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem;">Email cannot be changed.</p>
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="profile-phone" class="form-control" placeholder="+1 (555) 000-0000" />
              </div>
              <div class="form-group">
                <label class="form-label">Location</label>
                <input type="text" id="profile-location" class="form-control" placeholder="City, Country" />
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="loadProfile()">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="js/script.js"></script>
  <script>
    // Load profile information
    function loadProfile() {
      const currentUser = JSON.parse(localStorage.getItem('findit_currentUser'));

      // Protect route: Redirect if not logged in
      if (!currentUser) {
        showToast('Please log in to access settings', 'error');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);
        return;
      }

      // Populate fields
      document.getElementById('profile-name').value = currentUser.name || '';
      document.getElementById('profile-email').value = currentUser.email || '';
      document.getElementById('profile-phone').value = currentUser.phone || '';
      document.getElementById('profile-location').value = currentUser.location || '';

      // Update sidebar
      document.getElementById('sidebar-name').textContent = currentUser.name || 'User';
      const initial = (currentUser.name || 'U').charAt(0).toUpperCase();
      document.getElementById('sidebar-avatar').textContent = initial;
    }

    // Save changes
    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const newName = document.getElementById('profile-name').value.trim();
      const newPhone = document.getElementById('profile-phone').value.trim();
      const newLocation = document.getElementById('profile-location').value.trim();

      if (!newName) {
        showToast('Name is required', 'error');
        return;
      }

      const currentUser = JSON.parse(localStorage.getItem('findit_currentUser'));
      if (!currentUser) return;

      // Update currentUser session
      currentUser.name = newName;
      currentUser.phone = newPhone;
      currentUser.location = newLocation;
      localStorage.setItem('findit_currentUser', JSON.stringify(currentUser));

      // Update persistent users database in LocalStorage
      const users = JSON.parse(localStorage.getItem('findit_users')) || [];
      const userIndex = users.findIndex(u => u.email === currentUser.email);
      if (userIndex !== -1) {
        users[userIndex].name = newName;
        users[userIndex].phone = newPhone;
        users[userIndex].location = newLocation;
        localStorage.setItem('findit_users', JSON.stringify(users));
      }

      // Reload UI elements
      document.getElementById('sidebar-name').textContent = newName;
      document.getElementById('sidebar-avatar').textContent = newName.charAt(0).toUpperCase();

      showToast('Profile updated successfully!', 'success');
    });

    // Run on startup
    loadProfile();
  </script>
</body>

</html>
