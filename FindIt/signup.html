<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - FindIt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="auth-container animate-fade-in">
      <div class="auth-card">

        <div class="text-center mb-6">
          <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
          <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Create an Account</h1>
          <p class="text-muted" style="font-size: 0.875rem;">Join FindIt to start recovering items</p>
        </div>

        <button class="btn btn-secondary w-full mb-4" onclick="handleGoogleSignup()" style="font-weight: 500;">
          <i class="fa-brands fa-google" style="color: #1e3a5f;"></i> Sign up with Google
        </button>

        <div class="divider"><span>or sign up with email</span></div>

        <form id="signup-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="name" class="form-control" required placeholder="John Doe">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" class="form-control" required placeholder="you@example.com">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" class="form-control" required minlength="8"
                placeholder="Create a strong password">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary w-full mt-4" style="padding: 0.875rem;">
            <i class="fa-solid fa-user-plus"></i> Sign Up
          </button>
        </form>

        <p class="text-center text-muted mt-4" style="font-size: 0.875rem;">
          Already have an account? <a href="login.html" style="color: var(--secondary); font-weight: 600;">Sign in</a>
        </p>

      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="js/script.js"></script>

  <script>
    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      if (password.length < 8) {
        showToast('Password must be at least 8 characters', 'error');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';
      btn.disabled = true;

      setTimeout(() => {
        const users = JSON.parse(localStorage.getItem('findit_users')) || [];

        if (users.find(u => u.email === email)) {
          showToast('Email already registered', 'error');
          btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';
          btn.disabled = false;
          return;
        }

        users.push({ name, email, password });
        localStorage.setItem('findit_users', JSON.stringify(users));
        localStorage.setItem('findit_currentUser', JSON.stringify({ name, email }));

        showToast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }, 800);
    });

    window.handleGoogleSignup = () => {
      localStorage.setItem('findit_currentUser', JSON.stringify({ name: "Google User", email: "google@example.com" }));
      showToast('Google Sign Up successful!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    };
  </script>
</body>

</html>
